name: Update IndexTracker data

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data tools
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Fetch latest official data
        run: python scripts/update_data.py

      - name: Commit updated live data
        run: |
          git config user.name "IndexTracker Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/live-data.json
          git diff --cached --quiet && echo "No data changes." || git commit -m "chore: update latest index data"
          git push
